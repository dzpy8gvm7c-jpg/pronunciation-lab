<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pronunciation Lab: TH & -ED</title><style>:root{font-family:system-ui;background:#f7f5ef;color:#202838}body{margin:0}main{max-width:670px;margin:auto;padding:18px}.card{background:white;border:1px solid #e4e2da;border-radius:16px;padding:18px;margin:12px 0}button,select{font:inherit;padding:11px;border:1px solid #d7dce7;border-radius:10px;background:white;color:#202838;cursor:pointer}button.active,.primary{background:#326fea;color:white}.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.muted{color:#626c7d}.good{color:#168451}.bad{color:#bd3535}h1{font-size:25px}h2{font-size:20px}select{width:100%}.word{font-size:42px;text-align:center;font-weight:700}audio{width:100%}</style></head><body><main><h1>🎧 Pronunciation Lab</h1><div class="row" id="topics"></div><div class="row" id="tabs"></div><section class="card"><b>🔈 Choose a natural English voice</b><select id="voices" aria-label="English voice"></select><div class="row"><button onclick="speak('Hello! Let’s practise English pronunciation together.')">▶ Preview voice</button><button onclick="slow=!slow;render()" id="speed">Normal pace</button></div><small class="muted">Available voices depend on your browser and device. Enhanced, neural and natural voices are preferred automatically.</small></section><div id="content"></div></main><script>
const data={th:{name:'TH sound',groups:[['θ','/θ/ voiceless',['think','three','thumb','bath','mouth','month','thank','teeth','math','thirsty']],['ð','/ð/ voiced',['this','that','mother','brother','weather','breathe','they','father','then','together']]]},ed:{name:'-ED ending',groups:[['t','/t/',['worked','stopped','washed','laughed','watched','kissed','jumped','helped']],['d','/d/',['played','called','cleaned','loved','opened','listened','enjoyed','lived']],['id','/ɪd/',['wanted','needed','started','decided','visited','ended','waited','painted']]]}};
let topic='th',tab='learn',slow=false,voices=[],voice=null,current=null,answered=false,score=0,total=0,streak=0,rec=null,chunks=[];const $=id=>document.getElementById(id);
function loadVoices(){if(!('speechSynthesis'in window))return;let prior=voice?.voiceURI;voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));const rank=v=>(/natural|neural|enhanced|premium/i.test(v.name)?100:0)+(/samantha|ava|jenny|aria|allison|google|microsoft/i.test(v.name)?30:0)+(/en-US/i.test(v.lang)?10:0)-(/compact|espeak/i.test(v.name)?70:0);voices.sort((a,b)=>rank(b)-rank(a));voice=voices.find(v=>v.voiceURI===prior)||voices[0]||null;$('voices').innerHTML=voices.map((v,i)=>`<option value="${i}">${v.name} (${v.lang})</option>`).join('');$('voices').value=Math.max(0,voices.indexOf(voice))}
$('voices').onchange=e=>{voice=voices[+e.target.value]};if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=loadVoices;loadVoices()}
function speak(text,rate){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang=voice?.lang||'en-US';if(voice)u.voice=voice;u.rate=rate||(slow?.7:.9);u.pitch=1.02;speechSynthesis.speak(u)}
function choose(){let g=data[topic].groups[Math.floor(Math.random()*data[topic].groups.length)];current={key:g[0],word:g[2][Math.floor(Math.random()*g[2].length)]};answered=false}
function setTopic(t){topic=t;current=null;render()}function setTab(t){tab=t;current=null;render()}
function render(){let d=data[topic];$('topics').innerHTML=Object.keys(data).map(k=>`<button class="${topic===k?'active':''}" onclick="setTopic('${k}')">${data[k].name}</button>`).join('');$('tabs').innerHTML=[['learn','📖 Learn'],['listen','👂 Listen'],['say','🎤 Say it']].map(([k,n])=>`<button class="${tab===k?'active':''}" onclick="setTab('${k}')">${n}</button>`).join('');$('speed').textContent=slow?'Slow pace':'Normal pace';if(tab==='learn'){let intro=topic==='th'?'Place your tongue lightly between your teeth. /θ/ uses air without vocal vibration; /ð/ uses your voice.':'The -ed ending depends on the last SOUND of the base verb: /ɪd/ after /t/ or /d/; /t/ after other voiceless sounds; /d/ after other voiced sounds.';$('content').innerHTML=`<section class="card"><h2>${d.name}: Learn</h2><p>${intro}</p>${d.groups.map(g=>`<h3>${g[1]}</h3><div class="row">${g[2].map(w=>`<button onclick="speak('${w}')">🔊 ${w}</button>`).join('')}</div>`).join('')}<p class="muted">Tip: listen, repeat, then compare your sound with the model.</p></section>`;return}if(!current)choose();if(tab==='listen'){$('content').innerHTML=`<section class="card"><p class="muted">Score ${score}/${total} · 🔥 Streak ${streak}</p><h2>Which sound do you hear?</h2><div class="row"><button class="primary" onclick="speak(current.word)">🔊 Play</button><button onclick="speak(current.word,.65)">🐢 Slow</button></div><div class="row">${d.groups.map(g=>`<button id="choice_${g[0]}" onclick="answer('${g[0]}')">${g[1]}</button>`).join('')}</div><p id="feedback"></p><button onclick="current=null;render()">Next ➜</button></section>`;return}$('content').innerHTML=`<section class="card"><h2>Say it out loud</h2><div class="word">${current.word}</div><p class="muted" style="text-align:center">Target: ${d.groups.find(g=>g[0]===current.key)[1]}</p><div class="row"><button onclick="speak(current.word)">🔊 Model</button><button onclick="speak(current.word,.65)">🐢 Slow</button></div><p>Listen, record yourself, and compare.</p><div class="row"><button id="record" class="primary" onclick="recordAudio()">⏺ Record me</button>${window.SpeechRecognition||window.webkitSpeechRecognition?'<button onclick="recognize()">🤖 Auto-check</button>':''}</div><div id="playback"></div><p id="feedback"></p><div class="row"><button onclick="selfRate(true)">✅ Sounded like model</button><button onclick="selfRate(false)">🔁 Need practice</button><button onclick="current=null;render()">Next ➜</button></div><small class="muted">Speech recognition checks words, not precise sound production. Recording requires microphone permission and may be unavailable when opened as a local file.</small></section>`}
function answer(key){if(answered)return;answered=true;total++;let ok=key===current.key;if(ok){score++;streak++}else streak=0;$('feedback').className=ok?'good':'bad';$('feedback').textContent=(ok?'✅ Correct! ':'❌ Not quite. ')+current.word+' uses '+data[topic].groups.find(g=>g[0]===current.key)[1];speak(current.word)}
async function recordAudio(){if(rec?.state==='recording'){rec.stop();return}try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());let url=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType}));$('playback').innerHTML=`<audio controls src="${url}"></audio>`;$('record').textContent='⏺ Record again'};rec.start();$('record').textContent='⏹ Stop';$('feedback').textContent='Recording…'}catch(e){$('feedback').textContent='Microphone unavailable. Allow access or open this page through localhost/HTTPS.'}}
function recognize(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return;let r=new R();r.lang='en-US';r.maxAlternatives=5;r.onresult=e=>{let words=[...e.results[0]].map(a=>a.transcript.toLowerCase().trim());$('feedback').textContent=words.some(w=>w.split(/\s+/).includes(current.word))?'✅ I heard '+current.word+'!':'🤔 I heard '+words[0]+'. Try again.'};r.onerror=()=>$('feedback').textContent='Speech recognition unavailable.';r.start()}
function selfRate(ok){total++;if(ok)score++;current=null;render()}render();</script></body></html>
